spring.application.name=study-track-backend
server.port=8080

# Database Configuration (Replace with your actual MySQL credentials)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:study_track}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:your_mysql_username}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Security Configuration (Generate a secure 256-bit base64 secret in production)
app.jwt.secret=${JWT_SECRET:YOUR_SECURE_256_BIT_SECRET_KEY_HERE}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
